{% extends "base.html" %}
{% block title %}Login · Secure File Sharing{% endblock %}
{% block content %}
<section class="narrow card">
  <h1>Masuk</h1>
  <p class="muted">Kirim file ke pengguna terdaftar dengan enkripsi AES-256-GCM, RSA-OAEP, dan tanda tangan RSA-PSS.</p>
  <form method="post">
    {{ csrf_input() }}
    <label>Username<input name="username" required autofocus autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn">Masuk</button>
  </form>
  <p class="muted">Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a></p>
</section>
{% endblock %}
